name: seal-build

# jquery@1.8.3 on npm is the coolaj86 "node-jquery" wrapper package, not a
# pack of the jquery repo: its tmp/jquery.js is jQuery's own grunt dist build
# and lib/node-jquery.js is node-jquery's `grunt build` (src/wrapper.js with
# that build inlined). node-jquery/ holds the wrapper's published sources;
# this workflow builds jQuery from src/, feeds dist/jquery.js to the wrapper,
# runs both test suites, and packs node-jquery/.

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "QUnit filter for the jQuery browser suite (module or test-name substring); empty runs the full suite"
        required: false
        default: ""

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .gitmodules points at dead git:// URLs; materialize the pinned
      # submodule commits over https instead (dirs exist but are empty).
      - name: Materialize submodules (sizzle, qunit) at pinned SHAs
        shell: bash
        run: |
          set -euo pipefail
          materialize() {
            local url="$1" sha="$2" dest="$3"
            local tmp
            tmp="$(mktemp -d)"
            git -C "$tmp" init -q
            git -C "$tmp" remote add origin "$url"
            git -C "$tmp" fetch -q --depth 1 origin "$sha"
            git -C "$tmp" checkout -q FETCH_HEAD
            echo "$dest @ $(git -C "$tmp" rev-parse HEAD)"
            test "$(git -C "$tmp" rev-parse HEAD)" = "$sha"
            rm -rf "$tmp/.git"
            mkdir -p "$dest"
            cp -a "$tmp/." "$dest/"
            rm -rf "$tmp"
          }
          materialize https://github.com/jquery/sizzle.git f0dc09b83356e8bf8adeeb555e09077a10af2dc6 src/sizzle
          materialize https://github.com/jquery/qunit.git 900f72051b0112342feda3d700a7a049d886b9ce test/qunit
          test -f src/sizzle/sizzle.js
          test -f test/qunit/qunit/qunit.js
          ls -la src/sizzle test/qunit

      - name: Write container scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/seal"
          cat > "$RUNNER_TEMP/seal/npmrc.sh" <<'SEAL_NPMRC_EOF'
          # npm registry time machine pinned to the node-jquery 1.8.3 publish date
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken 2012-12-01T00:03:02.297Z
          # npm 2 only sends the token when always-auth is on
          npm config set always-auth true
          node --version
          npm --version
          SEAL_NPMRC_EOF
          cat > "$RUNNER_TEMP/seal/build.sh" <<'SEAL_BUILD_EOF'
          set -euo pipefail
          . /seal/npmrc.sh
          npm install
          test -x ./node_modules/.bin/grunt
          # The published tmp/jquery.js was built on Windows (its header date
          # is "Eastern Standard Time"), where the sizzle submodule - which,
          # unlike jquery, has no `* eol=lf` .gitattributes - was checked out
          # with CRLF line endings; the Sizzle section of the release file
          # carries them. Reproduce that checkout for sizzle.js (idempotent).
          sed -i 's/\r\?$/\r/' src/sizzle/sizzle.js
          # = grunt `default` minus `submodules`, which only runs
          # `git submodule update` against the dead git:// URLs; the submodule
          # content was materialized over https in an earlier step.
          ./node_modules/.bin/grunt selector 'build:*:*' lint min 'dist:*'
          # Size report (last task of upstream's default). grunt-compare-size
          # 0.2.0 never calls its async done(), so it runs on its own after
          # the build has reported "Done, without errors.".
          ./node_modules/.bin/grunt compare_size
          ls -la dist
          head -n 12 dist/jquery.js
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_BUILD_EOF
          cat > "$RUNNER_TEMP/seal/node-jquery.sh" <<'SEAL_NODEJQ_EOF'
          set -euo pipefail
          . /seal/npmrc.sh
          cd /work/node-jquery
          # node-jquery's `grunt build` reads ./tmp/jquery.js when present
          # (else downloads it from googleapis); supply our source build.
          # Its `mkdir ./tmp && mkdir ./lib` short-circuits once tmp exists,
          # so create lib up front.
          mkdir -p tmp lib
          cp /work/dist/jquery.js tmp/jquery.js
          npm install
          ./node_modules/.bin/grunt build
          test -s lib/node-jquery.js
          grep -q "jQuery JavaScript Library v1.8.3" lib/node-jquery.js
          # The wrapper's own placeholder line must be gone. (One inline
          # "//JQUERY_SOURCE" legitimately remains: String.replace expands the
          # `$&` in Sizzle's `"\\$&"` - the published file has it too.)
          if grep -qx "  //JQUERY_SOURCE" lib/node-jquery.js; then
            echo "lib/node-jquery.js still has the //JQUERY_SOURCE placeholder line"
            exit 1
          fi
          ls -la tmp lib
          # node-jquery's own suite: `grunt test` (nodeunit over test/*.js, jsdom)
          npm test
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_NODEJQ_EOF
          cat > "$RUNNER_TEMP/seal/pack.sh" <<'SEAL_PACK_EOF'
          set -euo pipefail
          node --version
          npm --version
          cd /work/node-jquery
          rm -rf node_modules
          rm -f jquery-1.8.3.tgz
          # npm 2 records each file's uid/gid in the tar entries
          chown -R "$HOST_UID:$HOST_GID" /work
          npm pack
          tar tzvf jquery-1.8.3.tgz
          echo "member count: $(tar tzf jquery-1.8.3.tgz | wc -l)"
          chown -R "$HOST_UID:$HOST_GID" /work
          SEAL_PACK_EOF
          chmod +x "$RUNNER_TEMP/seal/"*.sh

      - name: Build jQuery (node 0.10 / npm 2, grunt 0.3)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/seal:/seal" \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10-wheezy bash /seal/build.sh
          test -s dist/jquery.js
          test -s dist/jquery.min.js

      - name: Build and test node-jquery wrapper (node 0.10 / npm 2)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/seal:/seal" \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10-wheezy bash /seal/node-jquery.sh
          cmp dist/jquery.js node-jquery/tmp/jquery.js
          test -s node-jquery/lib/node-jquery.js

      - name: Set up Node 20 (test driver)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install headless browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/driver"
          cd "$RUNNER_TEMP/driver"
          npm init -y
          npm install puppeteer-core@22

      - name: Locate Chrome and PHP
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="${CHROME_BIN:-$(command -v google-chrome)}"
          echo "CHROME_PATH=$CHROME_PATH"
          "$CHROME_PATH" --version
          php --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      # jQuery's real QUnit unit suite (upstream ran it in browsers via
      # TestSwarm), incl. the Sizzle subproject suite, against dist/jquery.js,
      # served by PHP for the ajax fixtures, in headless Chrome.
      - name: Run jQuery QUnit test suite (headless Chrome)
        shell: bash
        env:
          SEAL_TEST_FILTER: ${{ inputs.test-filter }}
          # Environment-dependent in modern headless Chrome (not jQuery bugs):
          # widows/orphans default is now "2"; Blink snaps offsets to 1/64 px.
          SEAL_SKIP_TESTS: >-
            css: widows & orphans #8936||offset: fractions (see #7730 and #7885)
        run: |
          set -euo pipefail
          # Multiple workers are load-bearing: single-process php -S starves
          # the fixture iframes the suite opens.
          PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > "$RUNNER_TEMP/php.log" 2>&1 &
          PHP_PID=$!
          ready=0
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/test/index.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "PHP server did not come up"
            cat "$RUNNER_TEMP/php.log"
            exit 1
          fi
          status=0
          NODE_PATH="$RUNNER_TEMP/driver/node_modules" \
            node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html" \
            || status=$?
          if kill -0 "$PHP_PID" 2>/dev/null; then
            kill "$PHP_PID"
          fi
          if [ "$status" -ne 0 ]; then
            echo "--- php.log (tail) ---"
            tail -n 100 "$RUNNER_TEMP/php.log"
          fi
          exit "$status"

      - name: Pack node-jquery (node 0.10 / npm 2)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/seal:/seal" \
            -w /work \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            node:0.10-wheezy bash /seal/pack.sh
          ls -la node-jquery/jquery-1.8.3.tgz

      - name: List tarball members
        shell: bash
        run: |
          set -euo pipefail
          tar tzvf node-jquery/jquery-1.8.3.tgz
          # Exactly the public jquery-1.8.3.tgz member set (14 files).
          cat > "$RUNNER_TEMP/expected-members.txt" <<'SEAL_MEMBERS_EOF'
          package/.npmignore
          package/LICENSE-MIT
          package/README.md
          package/grunt.js
          package/lib/node-jquery.js
          package/package.json
          package/src/wrapper.js
          package/test/core.js
          package/test/css.js
          package/test/fixtures/core.html
          package/test/fixtures/css.css
          package/test/fixtures/css.html
          package/test/helpers/helper.js
          package/tmp/jquery.js
          SEAL_MEMBERS_EOF
          tar tzf node-jquery/jquery-1.8.3.tgz | LC_ALL=C sort > "$RUNNER_TEMP/actual-members.txt"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-members.txt" "$RUNNER_TEMP/expected-members.txt"
          diff "$RUNNER_TEMP/expected-members.txt" "$RUNNER_TEMP/actual-members.txt"
          echo "member set matches the public tarball ($(wc -l < "$RUNNER_TEMP/actual-members.txt") files)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jquery-npm
          path: node-jquery/jquery-1.8.3.tgz
          if-no-files-found: error
